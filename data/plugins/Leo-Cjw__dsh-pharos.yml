url: https://github.com/Leo-Cjw/dsh-pharos
name: Leo-Cjw/dsh-pharos
category: notify
description:
  en: 'Desktop notifier and message alerts for DSH. A system toast, a per-kind chime and a "🔔 需要你 ·" tab-title marker when the agent needs you (approval, plan review, question), or when a reply finishes in the background with a duration summary; an unanswered request re-alerts once after 10 minutes, and errors, interrupts and usage limits alert too. A host half bridges session events to the browser over SSE and pushes them to WeCom, Feishu, DingTalk or a generic webhook with per-channel signing, alongside a loopback-only HTTP surface for the event stream, config and remote trigger. The plugin settings tab holds the per-kind toggles, quiet hours, subagent filtering, volume, click-to-focus and webhooks. No npm dependencies.'
  zh: 'DSH 桌面端消息提醒。模型需要你操作（审批、方案确认、提问）或后台回复完成时弹出系统通知与提示音并标记标签页标题，完成带耗时小结；10 分钟未处理补发一次，出错、中断、用量上限同样提醒。宿主半经 SSE 桥接会话事件，可推送企业微信 / 飞书 / 钉钉 / 通用 Webhook（各渠道带签名），并提供仅限本机回环的事件流、配置与远程触发接口。插件设置页可配各事件开关、安静时段、子代理过滤、音量、点击聚焦与 Webhook。无 npm 依赖。'
