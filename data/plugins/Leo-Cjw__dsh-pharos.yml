url: https://github.com/Leo-Cjw/dsh-pharos
name: Leo-Cjw/dsh-pharos
category: notify
description:
  en: 'Desktop notifications for DSH: a system toast, a per-kind chime and a tab-title marker when the agent needs you (approval, plan review, question) or a reply finishes in the background; errors, interrupts, usage limits and multi-agent workflow progress alert too. A host half adds SSE delivery, webhook push to WeCom/Feishu/DingTalk or a generic endpoint, and per-turn token/cache/TPS stats.'
  zh: 'DSH 桌面端消息提醒：模型需要你操作（审批、方案确认、提问）或后台回复完成时，弹出系统通知与提示音并标记标签页标题；出错、中断、用量上限与多 agent 工作流进展同样提醒。宿主半另外提供 SSE 投递、推送到企业微信 / 飞书 / 钉钉 / 通用 Webhook，以及当轮统计（token 用量 / 缓存命中率 / TPS）。'
