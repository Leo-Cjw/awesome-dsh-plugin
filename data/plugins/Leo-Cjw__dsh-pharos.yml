url: https://github.com/Leo-Cjw/dsh-pharos
name: Leo-Cjw/dsh-pharos
category: notify
description:
  en: 'Desktop notifier for DeepSeek Harness. Notifies when the agent needs you (approval, plan review or question) with the tool name, reason or question text, a per-kind chime and a "🔔 needs you" tab-title marker, re-alerting once after 10 minutes if it is still unhandled; also alerts on background completion with a per-run duration summary, and on error, interrupt and usage-limit events. A host half bridges session events to the browser over SSE, pushes to WeCom, Feishu, DingTalk or a generic webhook with per-channel signing, and serves loopback-only HTTP endpoints for the event stream, config and remote trigger (optional x-pharos-token). Quiet hours, subagent filtering, volume, click-to-focus and the rest are set from a settings tab or the console API. Zero npm dependencies.'
  zh: 'DSH 桌面端守望提醒。模型需要你操作（审批 / 方案确认 / 提问）时弹出系统通知，正文带工具名、原因或问题文本，按事件类型播放不同提示音，并在标签页钉上“🔔 需要你”标记，10 分钟未处理补发一次；回复在后台完成或后台任务结束时通知并附本次运行耗时小结，出错、中断、用量上限同样提醒。宿主半经 SSE 把会话事件送到浏览器半，并可推送到企业微信 / 飞书 / 钉钉 / 通用 Webhook（各渠道带签名），另提供仅限本机回环的 HTTP 接口，用于事件流、配置与远程触发（可选 x-pharos-token）。安静时段、子代理过滤、音量、点击聚焦等可在设置页或控制台 API 配置。零 npm 依赖。'
